[package]
name = "zipher-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
anyhow = "1"
hex = "0.4"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
secrecy = "0.8"
zeroize = "1"
lazy_static = "1"
nonempty = "0.11"
prost = "0.14"
futures-util = "0.3"
tonic = { version = "0.14", features = ["channel", "tls-ring", "tls-webpki-roots"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
bip0039 = { version = "0.14", features = ["rand"] }

# Shared stable wallet layer and Zakura Common cryptography
zcash_protocol = { workspace = true }
zcash_address = { workspace = true }
zcash_client_backend = { workspace = true, features = ["lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots", "transparent-inputs", "pczt", "non-standard-fees", "tor"] }
pczt = { workspace = true }
zcash_client_sqlite = { workspace = true, features = ["orchard", "transparent-inputs", "serde"] }
zcash_pool_migration = { workspace = true, features = ["wallet"] }
zcash_keys = { workspace = true, features = ["orchard", "sapling", "unstable-frost"] }
zcash_primitives = { workspace = true }
zcash_proofs = { workspace = true, features = ["local-prover"] }
zcash_transparent = { workspace = true }
zcash_script = "0.4"
zip32 = "0.2"
sapling-crypto = { workspace = true }
orchard = { workspace = true }
incrementalmerkletree = "0.8"
blake2b_simd = "1"
sha2 = "0.10"
ff = { workspace = true }
pasta_curves = { workspace = true }

rustls = { version = "0.23", features = ["ring"] }
reqwest = { version = "0.13", features = ["json"] }
reddsa = { workspace = true, features = ["frost", "serde"] }
frost-rerandomized = "3.0"
frost-core = { version = "3.0", features = ["serde"] }
xeddsa = "1.0.2"
snow = "0.9.6"
uuid = "1"

# EVM signing (OWS signer — no tonic/prost, just crypto)
ows-signer = { path = "../../../ows-core/ows/crates/ows-signer", version = "=1.0.0" }

# Vault encryption
aes-gcm = "0.10"
scrypt = "0.11"

[features]
default = []

[dev-dependencies]
tempfile = "3"
