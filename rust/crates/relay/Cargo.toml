[package]
name = "zipher-relay"
version = "0.1.0"
edition = "2021"
description = "Blind message relay for Zipher HITL approvals: stores only token hashes and ciphertexts"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "fs", "signal"] }
zipher-hitl-protocol = { path = "../hitl-protocol" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
