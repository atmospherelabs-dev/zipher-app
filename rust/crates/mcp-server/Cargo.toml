[package]
name = "zipher-mcp-server"
version = "0.3.1-rc.1"
edition = "2021"

[[bin]]
name = "zipher-mcp-server"
path = "src/main.rs"

[dependencies]
zipher-engine = { path = "../engine" }
ows-lib = { path = "../../vendor/ows-lib" }
ows-signer = { path = "../../vendor/ows-signer" }
# Keep the transport on stdio and exclude pre-security-fix 1.x releases.
rmcp = { version = "1.8", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.8"
zeroize = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
zcash_protocol = { workspace = true }
zcash_address = { workspace = true }
dirs = "6"
reqwest = "0.13"

uuid = { version = "1", features = ["v4"] }
