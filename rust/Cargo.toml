[workspace]
members = ["crates/engine", "crates/cli", "crates/mcp-server", "crates/rng-compat"]

[package]
name = "rust_lib_zipher"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
zipher-engine = { path = "crates/engine" }
flutter_rust_bridge = "=2.11.1"
anyhow = "1"
tracing = "0.1"
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Shared stable wallet layer and Zakura Common cryptography
zcash_protocol = { workspace = true }
zcash_address = { workspace = true }
zcash_client_backend = { workspace = true, features = ["lightwalletd-tonic", "transparent-inputs", "tor"] }
bip0039 = { version = "0.14", features = ["rand"] }

zcash_pool_migration = { workspace = true }
secrecy = "0.8"
orchard = { workspace = true }

tracing-subscriber = { version = "0.3", features = ["fmt"] }

[features]
dart_ffi = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.dev]
opt-level = 1
debug = true

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[patch.crates-io]
# Stable wallet layer adapted to Zakura Common; retains Ironwood migration storage.
zcash_client_backend = { path = "vendor/zcash_client_backend" }
zcash_client_sqlite = { path = "vendor/zcash_client_sqlite" }
zcash_pool_migration = { path = "vendor/zcash_pool_migration" }
pczt = { path = "vendor/pczt" }

[workspace.dependencies]
zcash_protocol = "0.10.6"
zcash_address = "0.13.0"
zcash_client_backend = "0.24.0"
zcash_client_sqlite = "0.22.0"
zcash_pool_migration = "0.1.0"
pczt = "0.9.3"
zcash_transparent = "0.10.0"
zip321 = "0.9.0"
orchard = { package = "zakura-orchard", version = "=1.2.0" }
zcash_keys = { package = "zakura-keys", version = "=1.2.0" }
zcash_primitives = { package = "zakura-primitives", version = "=1.2.0" }
zcash_proofs = { package = "zakura-proofs", version = "=1.2.0" }
pasta_curves = { package = "zakura-pasta-curves", version = "=1.2.0" }
reddsa = { package = "zakura-reddsa", version = "=1.2.0" }
sapling-crypto = { package = "zakura-sapling-crypto", version = "=1.2.0" }
ff = "0.14"
