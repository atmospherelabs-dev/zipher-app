[workspace]
members = ["crates/engine", "crates/cli", "crates/mcp-server"]

[package]
name = "rust_lib_zipher"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
zipher-engine = { path = "crates/engine" }
flutter_rust_bridge = "=2.11.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
log = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.8"

# Zcash crates (NU6.3 / Ironwood — orchard 0.15 / v6 tx format)
zcash_protocol = "0.10.0-pre.0"
zcash_address = "0.13.0-pre.0"
zcash_client_backend = { version = "0.23", features = ["lightwalletd-tonic", "transparent-inputs"] }
zip32 = "0.2"
zcash_keys = { version = "0.15.0-pre.0", features = ["orchard", "sapling", "unstable-frost"] }
bip0039 = { version = "0.14", features = ["rand"] }
xeddsa = "1.0.2"
snow = "0.9.6"
uuid = "1"

zcash_client_sqlite = { version = "0.21", features = ["orchard", "transparent-inputs"] }
secrecy = "0.8"
tonic = { version = "0.14", features = ["channel", "tls-ring", "tls-webpki-roots"] }
prost = "0.14"
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = "1"
sapling-crypto = { version = "0.7", package = "sapling-crypto" }
orchard = "0.15.0-pre.1"
incrementalmerkletree = "0.8"
zcash_primitives = "0.29.0-pre.0"
zcash_proofs = "0.29.0-pre.0"
zcash_transparent = "0.9.0-pre.0"
zcash_script = "0.4"
zip321 = "0.8"

rustls = { version = "0.23", features = ["ring"] }
lazy_static = "1"
json = "0.12"
http = "1"
nonempty = "0.11"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[features]
dart_ffi = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.dev]
opt-level = 1
debug = true

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[patch.crates-io]
# Pin to librustzcash PR #2539 branch (dw/ironwood-scan-model).
# Full Ironwood wallet path: scan + store + balance + select + spend + routing.
# Same rev used by zcash-devtool PR #209 for testnet Ironwood testing.
# TODO: re-pin to main once PR #2539 merges.
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
pczt = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
zip321 = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
equihash = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
f4jumble = { git = "https://github.com/zcash/librustzcash.git", rev = "70bdaeef" }
