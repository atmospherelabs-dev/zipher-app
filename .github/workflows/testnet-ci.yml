name: Wallet Regression Tests

on:
  push:
    branches: [main, dev]
    paths:
      - "rust/**"
      - "npm/**"
      - "scripts/verify-wallet-stack.py"
      - "scripts/verify-dependency-security.py"
      - "scripts/tests/**"
      - "pubspec.yaml"
      - "build.env"
      - "pubspec.lock"
      - "test/archive_security_test.dart"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/testnet-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "npm/**"
      - "scripts/verify-wallet-stack.py"
      - "scripts/verify-dependency-security.py"
      - "scripts/tests/**"
      - "pubspec.yaml"
      - "build.env"
      - "pubspec.lock"
      - "test/archive_security_test.dart"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/testnet-ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ZIPHER_DATA_DIR: /tmp/zipher-testnet
  ZIPHER_CHAIN: testnet

jobs:
  archive-security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1' # Match build.env and the locked SDK dependencies.
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check archive extraction boundaries
        run: flutter test --no-pub --no-test-assets test/archive_security_test.dart

  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: testnet-ci-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake

      - name: Install pinned advisory auditor
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2, reviewed 2026-11-04
        with:
          tool: cargo-audit@0.22.1

      - name: Verify one wallet crypto family
        run: |
          mkdir -p target
          cargo metadata --locked --format-version 1 > target/wallet-stack.json
          python3 ../scripts/verify-wallet-stack.py target/wallet-stack.json
          audit_status=0
          cargo audit --json > target/security-audit.json || audit_status=$?
          # Evaluate every finding; the only source-reviewed exception is RSA's
          # newly published fix while RustSec still lists patched=[].
          python3 ../scripts/verify-dependency-security.py target/wallet-stack.json target/security-audit.json
          test "$audit_status" -le 1
          python3 -m unittest discover -s ../scripts/tests -p test_dependency_security.py

      - name: Test npm artifact verification
        run: node --test ../npm/test/*.test.js

      - name: Run unit tests
        run: cargo test --locked --workspace --exclude rust_lib_zipher

      - name: Build CLI (release)
        run: cargo build --locked --release -p zipher-cli

      - name: Smoke test - CLI help
        run: ./target/release/zipher-cli --help

      - name: Smoke test - version
        run: ./target/release/zipher-cli --version

      - name: Build MCP server
        run: cargo build --locked --release -p zipher-mcp-server

      - name: Smoke test - MCP version and help
        run: |
          ./target/release/zipher-mcp-server --version
          ./target/release/zipher-mcp-server --help

      - name: Clippy
        run: cargo clippy --locked -p zipher-cli -p zipher-mcp-server -p zipher-engine
